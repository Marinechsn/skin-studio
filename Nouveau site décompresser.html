<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skin Studio — Réservation (démo V2)</title>
<style>
:root{--brown:#4a2a1b;--brown2:#6f4a36;--cream:#fbf5ef;--card:#fffaf6;--line:#dcc8b8;--text:#342117;--muted:#806a5b;--soft:#f2e5da;--shadow:0 8px 28px rgba(72,42,27,.08)}
*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--brown);color:#fff7f0;text-align:center;padding:16px 12px 14px;position:sticky;top:0;z-index:5;box-shadow:0 3px 16px rgba(54,31,20,.08)}
header .brand{font:28px Georgia,serif;letter-spacing:.5px}header small{display:block;font-size:10px;letter-spacing:3px;margin-top:4px;opacity:.92}
main{max-width:560px;margin:auto;padding:18px 18px 42px}.steps{text-align:center;font-size:11px;letter-spacing:.5px;color:var(--muted);margin:2px 0 18px}.steps b{color:var(--brown)}
h1{font:34px Georgia,serif;text-align:center;margin:8px 0 20px}h2{font:25px Georgia,serif;margin:28px 0 12px}.intro{text-align:center;color:var(--muted);font-size:14px;margin:-10px 0 18px}
.item{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px 18px;margin:12px 0;width:100%;text-align:left;color:inherit;box-shadow:var(--shadow);transition:.15s;cursor:pointer}.item.active{border:2px solid var(--brown);background:var(--soft)}.item strong{display:block;font-size:18px}.item span{display:block;color:var(--muted);margin-top:7px;font-size:14px;line-height:1.35}.item .price{float:right;color:var(--brown);font-weight:700}
.btn{background:var(--brown);color:white;border:0;border-radius:999px;padding:15px 20px;width:100%;margin-top:22px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 7px 20px rgba(74,42,27,.18)}.btn:disabled{opacity:.35;box-shadow:none}.back{background:transparent;border:0;color:var(--brown);margin:18px auto 0;display:block;font-size:14px}
.selection{background:#f3e6dc;border-radius:16px;padding:14px 16px;margin:0 0 18px;font-size:14px;line-height:1.5}.selection strong{display:block;font-size:15px}
.calendar{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.month{font:21px Georgia,serif}.nav{border:0;background:#f1e5dc;color:var(--brown);width:34px;height:34px;border-radius:50%;font-size:19px}.week,.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-size:11px;color:var(--muted);padding:3px 0}.day{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:13px}.day.selectable{background:#fffdfb;border:1px solid #ead9cd}.day.selectable:hover{background:#f6e9df}.day.active{background:var(--brown);color:#fff;border-color:var(--brown)}.day:disabled{color:#c9b9ae}.empty{visibility:hidden}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 6px;color:var(--text);font-size:14px}.slot.active{border:2px solid var(--brown);background:var(--soft);font-weight:700}.slot:disabled{opacity:.3}.note{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 2px 0}
input{display:block;width:100%;padding:15px;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:#fffaf6;font-size:16px;color:var(--text)}.check{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px;line-height:1.45;margin-top:12px}.check input{width:auto;margin:3px 0 0}.summary{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:18px;line-height:1.8;box-shadow:var(--shadow)}.summary strong{color:var(--brown)}.muted{color:var(--muted);font-size:13px;line-height:1.55}.success{font-size:44px;text-align:center;margin:10px 0}.hidden{display:none}
@media (max-width:390px){main{padding-left:14px;padding-right:14px}h1{font-size:31px}.slots{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="brand">SKIN STUDIO</div><small>CLERMONT-FERRAND</small></header>
<main><div class="steps" id="steps"></div><section id="page"></section></main>
<script>
const services=[
 {name:'Skin Pure',price:40,duration:45,desc:'Soin visage purifiant'},
 {name:'Hydra Skin',price:75,duration:75,desc:'Soin complet'},
 {name:'Dermaplaning',price:40,duration:40,desc:'Soin exfoliant'},
 {name:'Hydra Skin + Dermaplaning',price:95,duration:90,desc:'Le combo idéal'},
 {name:'Back Pure',price:55,duration:40,desc:'Soin purifiant du dos'},
 {name:'Back Detox',price:75,duration:60,desc:'Soin complet du dos'}
];
let step=0,chosen=-1,date='',hour='',person={},viewMonth=new Date();
const page=document.querySelector('#page'),steps=document.querySelector('#steps');
const pad=n=>String(n).padStart(2,'0');
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function startOfToday(){let d=new Date();d.setHours(0,0,0,0);return d}
function stepLabel(){const labels=['1 SOIN','2 DATE','3 INFOS','4 PAIEMENT'];steps.innerHTML=labels.map((x,i)=>`<${i===step?'b':'span'}>${x}</${i===step?'b':'span'}>`).join(' · ')}
function serviceCard(){if(chosen<0)return'';const s=services[chosen];return `<div class="selection"><strong>${s.name} — ${s.price} €</strong>${s.duration} min · acompte 15 €</div>`}
function validDay(d){const today=startOfToday(),max=new Date(today);max.setMonth(max.getMonth()+1);return d>=today && d<=max && d.getDay()!==0}
function drawCalendar(){
 const y=viewMonth.getFullYear(),m=viewMonth.getMonth();const first=new Date(y,m,1);const last=new Date(y,m+1,0);const jsDay=(first.getDay()+6)%7;let cells='';
 for(let i=0;i<jsDay;i++)cells+='<button class="day empty" disabled></button>';
 for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n),id=iso(d),ok=validDay(d);cells+=`<button class="day ${ok?'selectable':''} ${date===id?'active':''}" ${ok?'':'disabled'} onclick="date='${id}';hour='';draw()">${n}</button>`}
 return `<div class="calendar"><div class="cal-head"><button class="nav" onclick="moveMonth(-1)">‹</button><div class="month">${new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div><button class="nav" onclick="moveMonth(1)">›</button></div><div class="week"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div><div class="dates">${cells}</div></div>`
}
function moveMonth(delta){const n=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+delta,1),today=startOfToday(),max=new Date(today);max.setMonth(max.getMonth()+1);if(n.getFullYear()<today.getFullYear()|| (n.getFullYear()===today.getFullYear()&&n.getMonth()<today.getMonth()))return;if(n.getFullYear()>max.getFullYear()|| (n.getFullYear()===max.getFullYear()&&n.getMonth()>max.getMonth()))return;viewMonth=n;draw()}
function slotHtml(){if(!date)return'';const s=services[chosen],buffer=20,close=19*60;let arr=[];for(let m=10*60;m+s.duration+buffer<=close+buffer;m+=30){let t=`${pad(Math.floor(m/60))}:${pad(m%60)}`;let dt=new Date(date+'T'+t);if(dt.getTime()-Date.now()<7200000)continue;arr.push(`<button class="slot ${hour===t?'active':''}" onclick="hour='${t}';draw()">${t}</button>`)}return arr.join('')||'<p class="muted">Aucun créneau disponible pour cette date.</p>'}
function draw(){stepLabel();window.scrollTo({top:0,behavior:'instant'});
 if(step===0){page.innerHTML=`<h1>Réserver un soin</h1><p class="intro">Choisissez votre prestation.</p>`+services.map((s,i)=>`<button class="item ${chosen===i?'active':''}" onclick="chosen=${i};draw()"><span class="price">${s.price} €</span><strong>${s.name}</strong><span>${s.desc} · ${s.duration} min</span></button>`).join('')+`<button class="btn" ${chosen<0?'disabled':''} onclick="step=1;viewMonth=new Date();draw()">Choisir une date</button>`}
 else if(step===1){page.innerHTML=`${serviceCard()}<h1>Choisir une date</h1>${drawCalendar()}${date?`<h2>Choisir un horaire</h2><div class="slots">${slotHtml()}</div><p class="note">Les horaires proposés tiennent compte de la durée du soin. Un temps de 20 minutes est prévu entre deux rendez-vous pour le nettoyage et la préparation.</p>`:''}<button class="btn" ${!hour?'disabled':''} onclick="step=2;draw()">Continuer</button><button class="back" onclick="step=0;draw()">← Retour aux soins</button>`}
 else if(step===2){page.innerHTML=`${serviceCard()}<h1>Vos informations</h1><form id="form"><input name="first" placeholder="Prénom" required><input name="last" placeholder="Nom" required><input name="email" type="email" placeholder="E-mail" required><input name="phone" type="tel" placeholder="Téléphone" required><label class="check"><input type="checkbox" required><span>J’ai pris connaissance des conditions de réservation. Cette version est une démonstration.</span></label><button class="btn">Continuer</button></form><button class="back" onclick="step=1;draw()">← Retour</button>`;for(let x of ['first','last','email','phone'])document.querySelector(`[name=${x}]`).value=person[x]||'';document.querySelector('#form').onsubmit=e=>{e.preventDefault();person=Object.fromEntries(new FormData(e.target));step=3;draw()}}
 else if(step===3){const s=services[chosen];page.innerHTML=`<h1>Paiement</h1><div class="summary"><strong>${s.name}</strong><br>${new Date(date+'T12:00').toLocaleDateString('fr-FR',{dateStyle:'full'})} à ${hour}<br>Prix du soin : ${s.price} €<br><strong>Acompte en ligne : 15 €</strong><br>Reste à régler sur place : ${s.price-15} €</div><p class="muted">Démonstration uniquement : aucun paiement réel ne sera effectué.</p><button class="btn" onclick="step=4;draw()">Simuler le paiement de 15 €</button><button class="back" onclick="step=2;draw()">← Retour</button>`}
 else{const s=services[chosen];page.innerHTML=`<div class="success">✓</div><h1>Simulation terminée</h1><div class="summary"><strong>Exemple de confirmation</strong><br>${person.first} ${person.last}<br>${s.name}<br>${new Date(date+'T12:00').toLocaleDateString('fr-FR',{dateStyle:'full'})} à ${hour}<br>Acompte simulé : 15 €</div><p class="muted">Aucune réservation réelle, aucun paiement et aucun e-mail n’ont été créés.</p><button class="btn" onclick="step=0;chosen=-1;date='';hour='';person={};draw()">Nouvelle simulation</button>`}
}
draw();
</script>
</body>
</html>
