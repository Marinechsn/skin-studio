<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skin Studio — Réservation (démo)</title><style>:root{font-family:Arial,sans-serif;color:#352016;background:#f9f0e8}*{box-sizing:border-box}body{margin:0}header{background:#442719;color:#f9eee4;text-align:center;padding:27px 12px;font:30px Georgia,serif}header small{display:block;font:11px Arial;letter-spacing:3px;margin-top:8px}main{max-width:550px;margin:auto;padding:22px 18px 50px}h1{font:29px Georgia,serif;text-align:center}h2{font:22px Georgia,serif}.steps{text-align:center;font-size:12px;color:#795c4a}.item{border:1px solid #d8bbaa;background:#fff8f2;border-radius:13px;padding:17px;margin:11px 0;cursor:pointer;width:100%;text-align:left;color:inherit}.item.active,.slot.active{border:2px solid #623823;background:#f0ddcd}.item strong{display:block;font-size:17px}.item span{display:block;color:#715b4e;margin-top:7px;font-size:13px}.btn{background:#57311f;color:white;border:0;border-radius:22px;padding:15px 20px;width:100%;margin-top:20px;font-size:15px;cursor:pointer}.btn:disabled{opacity:.4}.back{background:transparent;border:0;color:#57311f;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:1px solid #d7b9a4;background:#fff8f2;border-radius:8px;padding:12px 4px;color:#422719}.slot:disabled{opacity:.3}input{display:block;width:100%;padding:14px;margin:12px 0;border:1px solid #d6bba8;border-radius:10px;background:#fffaf6;font-size:16px}.summary{background:#f1e1d3;padding:18px;border-radius:12px;line-height:1.8}.muted{color:#765c4c;font-size:13px}.hidden{display:none}</style></head><body><header>SKIN STUDIO<small>CLERMONT-FERRAND</small></header><main><div class="steps" id="steps">1 SOIN · 2 DATE · 3 INFOS · 4 PAIEMENT</div><section id="page"></section></main><script>const services=[['Skin Pure',40,45,'Soin visage purifiant'],['Hydra Skin',75,75,'Soin complet'],['Dermaplaning',40,40,'Soin exfoliant'],['Hydra Skin + Dermaplaning',95,90,'Le combo idéal'],['Back Pure',55,40,'Soin purifiant du dos'],['Back Detox',75,60,'Soin complet du dos']];let step=0,chosen=-1,date='',hour='',person={};const page=document.querySelector('#page');const pad=n=>String(n).padStart(2,'0');function draw(){window.scrollTo(0,0);if(step===0){page.innerHTML='<h1>Réserver un soin</h1>'+services.map((s,i)=>`<button class="item ${chosen===i?'active':''}" onclick="chosen=${i};draw()"><strong>${s[0]}</strong><span>${s[3]} · ${s[2]} min · ${s[1]} €</span></button>`).join('')+`<button class="btn" ${chosen<0?'disabled':''} onclick="step=1;draw()">Continuer</button>`}else if(step===1){let now=new Date(),days=[];for(let i=0;i<31;i++){let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);if(d.getDay()!==0)days.push(d)}page.innerHTML='<h1>Choisir une date</h1><div class="grid">'+days.map(d=>{let iso=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;return `<button class="slot ${date===iso?'active':''}" onclick="date='${iso}';hour='';draw()">${d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</button>`}).join('')+'</div>'+(date?'<h2>Choisir un horaire</h2><div class="grid">'+(()=>{let slots=[];for(let m=600;m+services[chosen][2]<=1140;m+=30){let t=`${pad(Math.floor(m/60))}:${pad(m%60)}`,dt=new Date(date+'T'+t);if(dt.getTime()-Date.now()<7200000)continue;slots.push(`<button class="slot ${hour===t?'active':''}" onclick="hour='${t}';draw()">${t}</button>`)}return slots.join('')||'<p>Aucun créneau disponible.</p>'})()+'</div>':'')+`<button class="btn" ${!hour?'disabled':''} onclick="step=2;draw()">Continuer</button><button class="back" onclick="step=0;draw()">Retour</button>`}else if(step===2){page.innerHTML='<h1>Vos informations</h1><form id="form"><input name="first" placeholder="Prénom" required><input name="last" placeholder="Nom" required><input name="email" type="email" placeholder="E-mail" required><input name="phone" type="tel" placeholder="Téléphone" required><label class="muted"><input style="width:auto;display:inline" type="checkbox" required> J’ai pris connaissance des conditions de réservation (à finaliser avant mise en ligne).</label><button class="btn">Continuer</button></form><button class="back" onclick="step=1;draw()">Retour</button>';for(let x of ['first','last','email','phone'])document.querySelector(`[name=${x}]`).value=person[x]||'';document.querySelector('#form').onsubmit=e=>{e.preventDefault();person=Object.fromEntries(new FormData(e.target));step=3;draw()}}else if(step===3){page.innerHTML=`<h1>Paiement sécurisé</h1><div class="summary"><strong>${services[chosen][0]}</strong><br>${new Date(date+'T12:00').toLocaleDateString('fr-FR',{dateStyle:'full'})} à ${hour}<br>Prix du soin : ${services[chosen][1]} €<br><strong>Acompte : 15 €</strong><br>Reste à régler : ${services[chosen][1]-15} €</div><p class="muted">Démonstration uniquement : aucun paiement réel ne sera effectué.</p><button class="btn" onclick="step=4;draw()">Simuler le paiement de 15 €</button><button class="back" onclick="step=2;draw()">Retour</button>`}else{page.innerHTML=`<h1>Simulation terminée ✓</h1><div class="summary"><strong>Exemple de confirmation</strong><br>${person.first} ${person.last}<br>${services[chosen][0]}<br>${new Date(date+'T12:00').toLocaleDateString('fr-FR',{dateStyle:'full'})} à ${hour}<br>Acompte simulé : 15 €</div><p class="muted">Aucune réservation ni e-mail n'a été créé. L'adresse de l'institut n'est pas affichée.</p><button class="btn" onclick="step=0;chosen=-1;date='';hour='';draw()">Nouvelle simulation</button>`}}draw();</script></body></html>
