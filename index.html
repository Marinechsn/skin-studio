<script>
'use strict';
const API='https://nvmwfqrvtbybrajtydbd.supabase.co/functions/v1';
const KEY='sb_publishable_eTaK3kkPmIyMNk7M2ijGCQ_a3rnAhUx';
const services=[{name:'Skin Pure',price:40,duration:45,desc:'Soin visage purifiant'},{name:'Hydra Skin',price:75,duration:75,desc:'Soin complet'},{name:'Dermaplaning',price:40,duration:40,desc:'Soin exfoliant'},{name:'Hydra Skin + Dermaplaning',price:95,duration:90,desc:'Le combo idéal'},{name:'Back Pure',price:55,duration:40,desc:'Soin purifiant du dos'},{name:'Back Detox',price:75,duration:60,desc:'Soin complet du dos'}];let step=-1,chosen=[],date='',hour='',person={},viewMonth=new Date(),available=[],loading=false,availabilityError='',bookingError='',submitting=false,bookingId='';
let paymentLoading=false,paymentError='',paymentPaid=false,paypalOrderId='';

const pad=n=>String(n).padStart(2,'0');
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function maxDate(){const d=today();d.setMonth(d.getMonth()+1);return d}
function validDay(d){return d>=today()&&d<=maxDate()&&d.getDay()!==0}

function slotHtml(){if(loading)return '<p class="muted">Chargement des horaires…</p>';if(availabilityError)return `<p class="error">${availabilityError}</p><button class="back" onclick="selectDate(date)">Réessayer</button>`;return available.map(t=>`<button class="slot ${hour===t?'active':''}" onclick="hour='${t}';draw()">${t}</button>`).join('')||'<p class="muted">Aucun créneau disponible à cette date.</p>'}

a réservation. Les paiements sont actuellement en mode test.</p><button class=\"pill\" onclick=\"goBooking()\">Commencer ma réservation</button></section><section class=\"faq\" id=\"questions\"><div class=\"eyebrow\" style=\"color:#8c725f;text-align:center\">Besoin d’une précision ?</div><h2 class=\"section-title\">Questions fréquentes</h2><details><summary>Où se trouve Skin Studio ?</summary><p>Skin Studio vous accueille à Clermont-Ferrand. L’adresse et les informations pratiques seront communiquées lors de la confirmation de votre rendez-vous.</p></details><details><summary>Comment réserver ?</summary><p>Sélectionnez vos soins, choisissez une date et un horaire disponibles, puis renseignez vos coordonnées dans le formulaire.</p></details><details><summary>Comment fonctionne l’acompte ?</summary><p>Un acompte de 15 € est demandé. La réservation est confirmée après vérification du paiement. Le site et le paiement sont actuellement en phase de test.</p></details><details><summary>Puis-je associer plusieurs soins ?</summary><p>Oui, vous pouvez sélectionner plusieurs prestations compatibles ; elles s’enchaînent pendant la même venue.</p></details></section><footer><div><div class=\"brand\">SKIN STUDIO</div><p>Clermont-Ferrand · Soins du visage & du dos</p></div><p>Sur rendez-vous<br><a href=\"#\" onclick=\"goBooking();return false\">Prendre rendez-vous</a></p></footer></div>"}else if(step===0){page.innerHTML='<h1>Réserver un soin</h1><p class="muted" style="text-align:center">Choisissez une ou plusieurs prestations.</p>'+services.map((s,i)=>'<button class="item '+(chosen.includes(i)?'active':'')+'" '+(serviceDisabled(i)?'disabled':'')+' onclick="toggleService('+i+')"><span class="price">'+s.price+' €</span><strong>'+s.name+'</strong><span>'+s.desc+' · '+s.duration+' min</span></button>').join('')+(chosen.length?'<div class="selection"><strong>Votre sélection : '+selectedServices().map(s=>s.name).join(' + ')+'</strong>Durée totale : '+totalDuration()+' min · Total : '+t
