<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skin Studio — Réservation</title>
<style>
:root{--brown:#4a2a1b;--cream:#fbf5ef;--card:#fffaf6;--line:#dcc8b8;--text:#342117;--muted:#806a5b;--soft:#f2e5da}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--brown);color:#fff7f0;text-align:center;padding:18px;position:sticky;top:0;z-index:2}header .brand{font:29px Georgia,serif}header small{display:block;letter-spacing:3px;font-size:10px;margin-top:5px}main{max-width:560px;margin:auto;padding:20px 17px 50px}h1{font:34px Georgia,serif;text-align:center;margin:15px 0 22px}h2{font:24px Georgia,serif;margin:25px 0 12px}.steps{text-align:center;color:var(--muted);font-size:11px;margin:3px 0 18px}.steps b{color:var(--brown)}.item,.calendar,.summary{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;width:100%;color:var(--text);box-shadow:0 8px 24px #482a1b12}.item{text-align:left;cursor:pointer}.item strong{font-size:18px}.item span{display:block;font-size:13px;color:var(--muted);margin-top:7px}.item .price{float:right;font-weight:bold;color:var(--brown);font-size:17px}.item.active,.slot.active{border:2px solid var(--brown);background:var(--soft)}button{font-family:inherit;cursor:pointer}.btn{display:block;background:var(--brown);color:white;border:0;border-radius:99px;padding:15px 20px;width:100%;margin-top:20px;font-size:16px;font-weight:600;text-align:center;text-decoration:none}.btn:disabled{opacity:.45;cursor:default}.back{background:none;border:0;color:var(--brown);display:block;margin:18px auto;font-size:14px}.selection{background:var(--soft);border-radius:15px;padding:14px 16px;font-size:14px;line-height:1.5}.selection strong{display:block}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.month{font:21px Georgia,serif}.nav{border:0;border-radius:50%;width:35px;height:35px;background:var(--soft);font-size:22px;color:var(--brown)}.week,.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;font-size:11px;color:var(--muted)}.day{aspect-ratio:1;border:0;border-radius:11px;background:transparent;color:var(--text)}.day.selectable{border:1px solid #ead9cd;background:white}.day.active{background:var(--brown);color:white}.day:disabled{opacity:.25;cursor:default}.empty{visibility:hidden}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{border:1px solid var(--line);border-radius:13px;background:var(--card);padding:13px;color:var(--text)}.muted,.note{font-size:13px;color:var(--muted);line-height:1.6}.error{color:#9a2626}.summary{line-height:1.9}.summary strong{color:var(--brown)}input{display:block;width:100%;padding:15px;margin:12px 0;border:1px solid var(--line);border-radius:13px;background:white;font-size:16px}.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--muted)}.check input{width:auto;margin:3px 0}.success{text-align:center;font-size:46px;color:var(--brown)}@media(max-width:380px){.slots{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="brand">SKIN STUDIO</div><small>CLERMONT-FERRAND</small></header><main><div class="steps" id="steps"></div><section id="page"></section></main>
<script>
'use strict';
const API='https://nvmwfqrvtbybrajtydbd.supabase.co/functions/v1';
const KEY='sb_publishable_eTaK3kkPmIyMNk7M2ijGCQ_a3rnAhUx';
const services=[{name:'Skin Pure',price:40,duration:45,desc:'Soin visage purifiant'},{name:'Hydra Skin',price:75,duration:75,desc:'Soin complet'},{name:'Dermaplaning',price:40,duration:40,desc:'Soin exfoliant'},{name:'Hydra Skin + Dermaplaning',price:95,duration:90,desc:'Le combo idéal'},{name:'Back Pure',price:55,duration:40,desc:'Soin purifiant du dos'},{name:'Back Detox',price:75,duration:60,desc:'Soin complet du dos'}];let step=0,chosen=[],date='',hour='',person={},viewMonth=new Date(),available=[],loading=false,availabilityError='',bookingError='',submitting=false,bookingId='';
let paymentLoading=false,paymentError='',paymentPaid=false,paypalOrderId='';
const page=document.getElementById('page'),steps=document.getElementById('steps');
const pad=n=>String(n).padStart(2,'0');
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function maxDate(){const d=today();d.setMonth(d.getMonth()+1);return d}
function validDay(d){return d>=today()&&d<=maxDate()&&d.getDay()!==0}
function selectedServices(){return chosen.map(i=>services[i])}
function totalDuration(){return selectedServices().reduce((sum,s)=>sum+s.duration,0)}
function totalPrice(){return selectedServices().reduce((sum,s)=>sum+s.price,0)}
function toggleService(i){const s=services[i],combo=s.name==='Hydra Skin + Dermaplaning',hasCombo=chosen.some(j=>services[j].name==='Hydra Skin + Dermaplaning'),isPart=s.name==='Hydra Skin'||s.name==='Dermaplaning',hasPart=chosen.some(j=>services[j].name==='Hydra Skin'||services[j].name==='Dermaplaning');if(chosen.includes(i)){chosen=chosen.filter(j=>j!==i)}else if(chosen.length<4&&!(combo&&hasPart)&&!(isPart&&hasCombo)){chosen=[...chosen,i]}date='';hour='';available=[];draw()}
function serviceDisabled(i){if(chosen.includes(i))return false;if(chosen.length>=4)return true;const name=services[i].name,combo=name==='Hydra Skin + Dermaplaning',hasCombo=chosen.some(j=>services[j].name==='Hydra Skin + Dermaplaning'),isPart=name==='Hydra Skin'||name==='Dermaplaning',hasPart=chosen.some(j=>services[j].name==='Hydra Skin'||services[j].name==='Dermaplaning');return(combo&&hasPart)||(isPart&&hasCombo)}
function serviceCard(){if(!chosen.length)return '';return '<div class="selection"><strong>'+selectedServices().map(s=>s.name).join(' + ')+'</strong>'+totalDuration()+' min · '+totalPrice()+' € · acompte 15 €</div>'}
function dateText(){return new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{dateStyle:'full'})}
function drawCalendar(){const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);let cells='';for(let i=0;i<(first.getDay()+6)%7;i++)cells+='<button class="day empty" disabled></button>';for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n),id=iso(d),ok=validDay(d);cells+=`<button class="day ${ok?'selectable':''} ${date===id?'active':''}" ${ok?'':'disabled'} onclick="selectDate('${id}')">${n}</button>`}return `<div class="calendar"><div class="cal-head"><button class="nav" onclick="moveMonth(-1)" aria-label="Mois précédent">‹</button><div class="month">${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</div><button class="nav" onclick="moveMonth(1)" aria-label="Mois suivant">›</button></div><div class="week">${['L','M','M','J','V','S','D'].map(x=>`<div>${x}</div>`).join('')}</div><div class="dates">${cells}</div></div>`}
function moveMonth(delta){const n=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+delta,1),min=today(),max=maxDate();if(n<new Date(min.getFullYear(),min.getMonth(),1)||n>new Date(max.getFullYear(),max.getMonth(),1))return;viewMonth=n;draw()}
async function api(path,body){const r=await fetch(`${API}/${path}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});let data;try{data=await r.json()}catch{throw Error('invalid_response')}if(!r.ok)throw Error(data.error||data.message||'server_error');return data}
async function selectDate(id){date=id;hour='';available=[];availabilityError='';loading=true;draw();try{const result=await api('get-availability',{soins:selectedServices().map(s=>s.name),date:id});if(date===id)available=result.available_slots||[]}catch(e){if(date===id)availabilityError='Impossible de charger les horaires. Réessayez.'}finally{if(date===id){loading=false;draw()}}}
function slotHtml(){if(loading)return '<p class="muted">Chargement des horaires…</p>';if(availabilityError)return `<p class="error">${availabilityError}</p><button class="back" onclick="selectDate(date)">Réessayer</button>`;return available.map(t=>`<button class="slot ${hour===t?'active':''}" onclick="hour='${t}';draw()">${t}</button>`).join('')||'<p class="muted">Aucun créneau disponible à cette date.</p>'}
function localIso(){const d=new Date(`${date}T${hour}:00`),offset=-d.getTimezoneOffset(),sign=offset>=0?'+':'-';return `${date}T${hour}:00${sign}${pad(Math.floor(Math.abs(offset)/60))}:${pad(Math.abs(offset)%60)}`}
async function reserve(){if(submitting||!date||!hour||!chosen.length)return;submitting=true;bookingError='';draw();try{const r=await api('create-booking',{prenom:person.first,nom:person.last,email:person.email,telephone:person.phone,soins:selectedServices().map(s=>s.name),debut_rdv:localIso()});bookingId=r.id;step=4;draw()}catch(e){bookingError='Impossible d’enregistrer la demande. Le créneau a peut-être été pris. Revenez aux horaires et réessayez.';draw()}finally{submitting=false}}async function startPaypal(){if(paymentLoading||!bookingId)return;paymentLoading=true;paymentError='';try{sessionStorage.setItem('skinStudioBooking',JSON.stringify({chosen,date,hour,bookingId}))}catch{}draw();try{const result=await api('paypal-checkout',{action:'create',booking_id:bookingId});window.location.assign(result.approval_url)}catch(e){paymentError='Le paiement PayPal automatique n’est pas encore configuré. Utilisez temporairement le lien manuel.';paymentLoading=false;draw()}}async function finishPaypal(){try{await api('paypal-checkout',{action:'capture',order_id:paypalOrderId});paymentPaid=true;paymentLoading=false;try{sessionStorage.removeItem('skinStudioBooking')}catch{}history.replaceState(null,'',location.pathname);draw()}catch(e){paymentError='Paiement non confirmé automatiquement. Ne payez pas une seconde fois ; contactez Skin Studio.';paymentLoading=false;draw()}}
function draw(){steps.innerHTML=['1 SOINS','2 DATE','3 INFOS','4 ACOMPTE'].map((x,i)=>i===Math.min(step,3)?`<b>${x}</b>`:x).join(' · ');
if(step===0){page.innerHTML='<h1>Réserver un soin</h1><p class="muted" style="text-align:center">Choisissez une ou plusieurs prestations.</p>'+services.map((s,i)=>'<button class="item '+(chosen.includes(i)?'active':'')+'" '+(serviceDisabled(i)?'disabled':'')+' onclick="toggleService('+i+')"><span class="price">'+s.price+' €</span><strong>'+s.name+'</strong><span>'+s.desc+' · '+s.duration+' min</span></button>').join('')+(chosen.length?'<div class="selection"><strong>Votre sélection : '+selectedServices().map(s=>s.name).join(' + ')+'</strong>Durée totale : '+totalDuration()+' min · Total : '+totalPrice()+' €</div>':'')+'<button class="btn" '+(!chosen.length?'disabled':'')+' onclick="step=1;viewMonth=new Date();draw()">Choisir une date</button>'}
else if(step===1){page.innerHTML=`${serviceCard()}<h1>Choisir une date</h1>${drawCalendar()}${date?`<h2>Choisir un horaire</h2><div class="slots">${slotHtml()}</div><p class="note">Les soins choisis ensemble s’enchaînent sans battement. Le délai de 20 minutes est prévu après l’ensemble de la réservation.</p>`:''}<button class="btn" ${!hour?'disabled':''} onclick="step=2;draw()">Continuer</button><button class="back" onclick="step=0;draw()">← Retour aux soins</button>`}
else if(step===2){page.innerHTML=`${serviceCard()}<h1>Vos informations</h1><form id="form"><input name="first" placeholder="Prénom" autocomplete="given-name" maxlength="100" required><input name="last" placeholder="Nom" autocomplete="family-name" maxlength="100" required><input name="email" type="email" placeholder="E-mail" autocomplete="email" required><input name="phone" type="tel" placeholder="Téléphone" autocomplete="tel" required><label class="check"><input type="checkbox" required><span>Je comprends que mon rendez-vous restera en attente jusqu’à la vérification de l’acompte de 15 € via PayPal.</span></label><button class="btn">Continuer</button></form><button class="back" onclick="step=1;draw()">← Retour</button>`;for(const k of ['first','last','email','phone'])document.querySelector(`[name=${k}]`).value=person[k]||'';document.getElementById('form').onsubmit=e=>{e.preventDefault();person=Object.fromEntries(new FormData(e.target));step=3;draw()}}
else if(step===3){const list=selectedServices();page.innerHTML='<h1>Votre demande</h1><div class="summary"><strong>'+list.map(s=>escapeHtml(s.name)).join(' + ')+'</strong><br>'+dateText()+' à '+hour+'<br>Durée totale : '+totalDuration()+' min<br>Prix total des soins : '+totalPrice()+' €<br><strong>Acompte : 15 €</strong><br>Reste à régler sur place : '+(totalPrice()-15)+' €</div><p class="muted">Les soins de cette réservation s’enchaînent sans délai entre eux. Votre demande sera enregistrée en attente de paiement. La confirmation sera effectuée manuellement après vérification de l’acompte.</p>'+(bookingError?'<p class="error" role="alert">'+escapeHtml(bookingError)+'</p>':'')+'<button class="btn" '+(submitting?'disabled':'')+' onclick="reserve()">'+(submitting?'Enregistrement…':'Enregistrer ma demande')+'</button><button class="back" onclick="step=2;draw()">← Retour</button>'}else if(paymentLoading){page.innerHTML='<h1>Vérification du paiement…</h1><p class="muted" style="text-align:center">Ne fermez pas cette page pendant la vérification.</p>'}else if(paymentPaid){page.innerHTML='<div class="success">✓</div><h1>Rendez-vous confirmé</h1><p class="muted" style="text-align:center">Acompte reçu. Votre rendez-vous est confirmé.</p><div class="summary">Référence : '+escapeHtml(bookingId)+'</div>'}else{page.innerHTML='<div class="success">✓</div><h1>Demande enregistrée</h1><div class="summary"><strong>En attente de paiement</strong><br>'+escapeHtml(person.first)+' '+escapeHtml(person.last)+'<br>'+selectedServices().map(s=>escapeHtml(s.name)).join(' + ')+'<br>'+dateText()+' à '+hour+'<br>Durée totale : '+totalDuration()+' min<br>Total : '+totalPrice()+' €<br>Acompte : 15 €<br>Référence : '+escapeHtml(bookingId)+'</div><p class="muted">Réglez l’acompte via PayPal. Indiquez votre nom et votre référence de réservation dans le message de paiement. Votre rendez-vous sera confirmé après vérification du paiement.</p>'+(paymentError?'<p class="error">'+escapeHtml(paymentError)+'</p>':'')+'<button class="btn" '+(paymentLoading?'disabled':'')+' onclick="startPaypal()">'+(paymentLoading?'Ouverture de PayPal…':'Payer 15 € avec PayPal')+'</button><a class="btn" style="background:#806a5b" href="https://www.paypal.me/marinechsn/15" target="_blank" rel="noopener noreferrer">Lien PayPal manuel</a>'+'<p class="note">Le paiement n’est pas vérifié automatiquement. Si vous avez fermé PayPal sans payer, votre demande reste en attente.</p><button class="back" onclick="step=0;chosen=[];date=\'\';hour=\'\';person={};bookingId=\'\';draw()">Nouvelle réservation</button>'}}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
draw();const params=new URLSearchParams(location.search),returnedBooking=params.get('booking_id'),returnedOrder=params.get('token');if(params.get('paypal')&&returnedBooking){try{const saved=JSON.parse(sessionStorage.getItem('skinStudioBooking')||'null');if(saved&&saved.bookingId===returnedBooking){chosen=saved.chosen||[];date=saved.date||'';hour=saved.hour||''}}catch{}bookingId=returnedBooking;step=4;if(params.get('paypal')==='success'&&returnedOrder){paypalOrderId=returnedOrder;paymentLoading=true;setTimeout(finishPaypal,0)}else if(params.get('paypal')==='cancel'){paymentError='Le paiement a été annulé. Votre demande reste en attente.'}}
draw();
</script></body></html>
